{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portal do Aluno</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <h1>Portal do Aluno</h1>

            <p>Acesse sua conta acadêmica</p>

            {% if erro %}
                <p class="erro">
                    {{ erro }}
                </p>
            {% endif %}

            <form method="post">

                {% csrf_token %}

                <div>
                    <label for="username">
                        Usuário
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                    >
                </div>

                <div>
                    <label for="password">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                    >
                </div>

                <button type="submit">
                    Entrar
                </button>

            </form>

        </section>

    </main>

    <script src="{% static 'js/main.js' %}"></script>

</body>

</html>

{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senha alterada - Portal do Aluno</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <!-- Bloco principal da estrutura visual em duas colunas -->
    <main class="login-split">

        <!-- Bloco do painel esquerdo: Apresentação institucional -->
        <section class="painel-esquerdo">
            <div class="marca">
                <div class="marca-icone">
                    <img src="{% static 'images/logo.jpeg' %}" alt="Logo Portal do Aluno">
                </div>
                <span>Portal do Aluno P.I</span>
            </div>
            <h1>Processo concluído com sucesso.</h1>
            <p class="descricao">Sua senha foi atualizada no banco de dados com criptografia segura.</p>
        </section>

        <!-- Bloco do painel direito: Mensagem de conclusão -->
        <section class="painel-direito">
            <div class="form-wrapper">
                <span class="eyebrow">Sucesso</span>
                <h2>Senha alterada!</h2>
                <p class="subtitulo">Sua senha foi trocada com sucesso. Você já pode fazer login no portal.</p>

                <!-- Bloco de ação: Botão para retornar à tela de login principal -->
                <div style="margin-top: 30px;">
                    <a href="{% url 'login' %}" style="display: block; text-align: center; background: #7C3AED; color: white; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: bold;">
                        Ir para o login
                    </a>
                </div>
            </div>
        </section>

    </main>

</body>
</html>

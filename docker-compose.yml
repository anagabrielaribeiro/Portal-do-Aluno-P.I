# Sobe o Portal do Aluno P.I com um PostgreSQL local
# uso: docker compose up --build
# as senhas e chaves vêm do arquivo .env (veja o .env.example), nada fica escrito aqui

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    # estas variáveis têm prioridade sobre o .env: apontam para o banco do Docker
    # e desligam HTTPS/proxy, que só existem na Vercel
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_SSL_REQUIRE: "False"
      FORCE_HTTPS: "False"
      BEHIND_PROXY: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dados_postgres:
